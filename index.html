<script>
/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://eqebdzbduixoyrqpsbui.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_tXcX-ng7EVHVaF1jaHXPlh7Ip98L";


/* =====================================================
   SUPABASE INITIALIZATION
===================================================== */

let supabaseClient = null;

function initializeSupabase() {

    try {

        if (!window.supabase) {
            throw new Error(
                "Supabase library did not load."
            );
        }

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        return true;

    } catch (error) {

        console.error(
            "Supabase initialization error:",
            error
        );

        showConnectionError(
            error.message
        );

        return false;
    }
}


/* =====================================================
   SETTINGS
===================================================== */

const TABLE_NAME =
    "booth_contributions";

const BUCKET_NAME =
    "booth-photos";

const MAX_VIDEO_SECONDS =
    5 * 60;


/*
   CHANGE THIS PIN IF YOU WANT.
*/

const ADMIN_PIN =
    "123456";


let contributions = [];


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        const initialized =
            initializeSupabase();

        if (!initialized) {
            return;
        }

);


/* =====================================================
   LOAD CONTRIBUTIONS
===================================================== */

async function loadContributions() {

    showLoading();

    try {

        console.log(
            "Loading booth contributions..."
        );

        /*
           IMPORTANT:
           We do NOT use created_at here because
           your table does not have that column.
        */

        const response =
            await supabaseClient
                .from(TABLE_NAME)
                .select("*");

        console.log(
            "Supabase response:",
            response
        );

        if (response.error) {
            throw response.error;
        }

        contributions =
            response.data || [];

        updateStatistics();

        displayContributors();

        displayGallery(
            contributions
        );

    } catch (error) {

        console.error(
            "Unable to load contributions:",
            error
        );

        showDatabaseError(
            error
        );
    }
}

/* =====================================================
   DATABASE ERROR
===================================================== */

                </p>

/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics() {

    const names =
        new Set();

    contributions.forEach(
        item => {

            if (item.name) {

                names.add(
                    item.name
                        .trim()
                        .toLowerCase()
                );
            }
        }
    );

    document
        .getElementById(
            "totalContributions"
        )
        .textContent =
            contributions.length;

    document
        .getElementById(
            "totalContributors"
        )
        .textContent =
            names.size;

    document
        .getElementById(
            "totalMedia"
        )
        .textContent =
            contributions.length;
}


/* =====================================================
   CONTRIBUTORS
===================================================== */

function displayContributors(search = "") {

    const container =
        document.getElementById(
            "contributorList"
        );

    const grouped = {};

    contributions.forEach(
        item => {

            const name =
                (
                    item.name ||
                    "Unknown Contributor"
                ).trim();

            if (!grouped[name]) {
                grouped[name] = 0;
            }

            grouped[name]++;
        }
    );

    const people =
        Object.entries(grouped)
            .filter(
                ([name]) =>
                    name
                        .toLowerCase()
                        .includes(
                            search.toLowerCase()
                        )
            )
            .sort(
                ([a], [b]) =>
                    a.localeCompare(b)
            );

    if (people.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👤
                </div>

                No contributors yet.

            </div>
        `;

        return;
    }

    container.innerHTML = "";

    people.forEach(
        ([name, count]) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "contributor";

            element.innerHTML = `

                <div class="contributor-name">

                    👤
                    ${escapeHTML(name)}

                </div>

                <div class="contributor-count">

                    ${count}
                    contribution${
                        count === 1
                            ? ""
                            : "s"
                    }

                </div>
            `;

            element.addEventListener(
                "click",
                function() {

                    document
                        .getElementById(
                            "searchInput"
                        )
                        .value =
                            name;

                    const filtered =
                        contributions.filter(
                            item =>
                                item.name ===
                                name
                        );

                    displayGallery(
                        filtered
                    );

                    document
                        .getElementById(
                            "gallery"
                        )
                        .scrollIntoView({
                            behavior:
                                "smooth"
                        });
                }
            );

            container.appendChild(
                element
            );
        }
    );
}


/* =====================================================
   GALLERY
===================================================== */

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📸
                </div>

                <h3>
                    No contributions yet.
                </h3>

                <p>
                    Be the first student to
                    share a contribution!
                </p>

            </div>
        `;

        return;
    }

    container.innerHTML = "";

    items.forEach(
        item => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "card";

            const mediaType =
                item.media_type ===
                "video"
                    ? "video"
                    : "image";

            const mediaURL =
                item.media_url ||
                "";

            let mediaHTML;

            if (mediaType === "video") {

                mediaHTML = `

                    <div
                        class="media"
                        onclick="openMedia(
                            ${JSON.stringify(mediaURL)},
                            'video'

                    >

                        <span class="media-label">
                            ▶ VIDEO
                        </span>

                        <video
                            preload="metadata"
                            muted
                            playsinline
                        >

                            <source
                                src="${escapeAttribute(mediaURL)}"
                            >

                        </video>

                    </div>
                `;

            } else {

                mediaHTML = `

                    <div
                        class="media"
                        onclick="openMedia(
                            ${JSON.stringify(mediaURL)},
                            'image'
                        )"
                    >

                        <span class="media-label">
                            📸 PHOTO
                        </span>

                        <img
                            src="${escapeAttribute(mediaURL)}"
                            alt="Booth contribution from ${escapeAttribute(item.name)}"
                            loading="lazy"
                            onerror="this.style.display='none';"

                    </div>
                `;
            }

            card.innerHTML = `

                ${mediaHTML}

                <div class="card-content">

                    <h3>
                        ${escapeHTML(
                            item.name ||
                            "Unknown Contributor"
                        )}
                    </h3>

                    <div class="card-description">

                        ${escapeHTML(
                            item.description ||
                            "No description provided."
                        )}

                    </div>

                    <div class="card-info">

                        <span>

                            👥

                            <strong>

                                ${escapeHTML(
                                    item.group_name ||
                                    "No group"
                                )}

                            </strong>

                        </span>

                    </div>

                    <div class="card-actions">

                        <button
                            class="card-action edit-button"
                            type="button"
                            data-action="edit"
                            data-id="${escapeAttribute(item.id)}"
                        >
                            ✏ EDIT
                        </button>

                        <button
                            class="card-action delete-button"
                            type="button"
                            data-action="delete"
                            data-id="${escapeAttribute(item.id)}"
                        >
                            🗑 DELETE
                        </button>

                    </div>

                </div>
            `;

            const editButton =
                card.querySelector(
                    '[data-action="edit"]'
                );

            const deleteButton =
                card.querySelector(
                    '[data-action="delete"]'
                );

            editButton.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    editContribution(
                        item.id
                    );
                }
            );

            deleteButton.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    deleteContribution(
                        item.id
                    );
                }
            );

            container.appendChild(
                card
            );
        }
    );
}


/* =====================================================
   VIDEO DURATION
===================================================== */

function getVideoDuration(file) {

    return new Promise(
        (resolve, reject) => {

            const video =
                document.createElement(
                    "video"
                );

            const objectURL =
                URL.createObjectURL(
                    file
                );

            video.preload =
                "metadata";

            video.onloadedmetadata =
                function() {

                    URL.revokeObjectURL(
                        objectURL
                    );

                    resolve(
                        video.duration
                    );
                };

            video.onerror =
                function() {

                    URL.revokeObjectURL(
                        objectURL
                    );

                    reject(
                        new Error(
                            "The browser could not read the video duration."
                        )
                    );
                };

            video.src =
                objectURL;
        }
    );
}


/* =====================================================
   FILE SELECTION
===================================================== */

document
    .getElementById("mediaFile")
    .addEventListener(
        "change",
        async function() {

            const file =
                this.files[0];

            const status =
                document.getElementById(
                    "videoStatus"
                );

            const button =
                document.getElementById(
                    "submitButton"
                );

            if (!file) {

                status.textContent =
                    "";

                button.disabled =
                    false;

                return;
            }

            /*
               Supabase bucket was configured for
               a maximum file size of 2 MB.
            */

            const MAX_FILE_SIZE =
                2 * 1024 * 1024;

            if (
                file.size >
                MAX_FILE_SIZE
            ) {

                status.textContent =
                    "❌ File is larger than the 2 MB limit.";

                status.style.color =
                    "#ff8585";

                button.disabled =
                    true;

                return;
            }

            if (
                file.type.startsWith(
                    "video/"
                )
            ) {

                status.textContent =
                    "Checking video duration...";

                status.style.color =
                    "#f2d68f";

                button.disabled =
                    true;

                try {

                    const duration =
                        await getVideoDuration(
                            file
                        );

                    if (
                        duration >
                        MAX_VIDEO_SECONDS
                    ) {

                        status.textContent =
                            "❌ This video is longer than 5 minutes.";

                        status.style.color =
                            "#ff8585";

                        button.disabled =
                            true;

                        return;
                    }

                    const minutes =
                        Math.floor(
                            duration / 60
                        );

                    const seconds =
                        Math.floor(
                            duration % 60
                        )
                        .toString()
                        .padStart(
                            2,
                            "0"
                        );

                    status.textContent =
                        `✅ Video accepted — ${minutes}:${seconds} / 5:00 maximum`;

                    status.style.color =
                        "#9de2af";

                    button.disabled =
                        false;

                } catch(error) {

                    status.textContent =
                        "❌ Could not read the video duration.";

                    status.style.color =
                        "#ff8585";

                    button.disabled =
                        true;
                }

            } else {

                status.textContent =
                    "✅ Photo selected.";

                status.style.color =
                    "#9de2af";

                button.disabled =
                    false;
            }
        }
    );


/* =====================================================
   SUBMIT CONTRIBUTION
===================================================== */

document
    .getElementById("contributionForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            if (!supabaseClient) {

                showToast(
                    "Supabase is not connected.",
                    "error"
                );

                return;
            }

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const groupName =
                document
                    .getElementById("groupName")
                    .value
                    .trim();

            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();

            const file =
                document
                    .getElementById("mediaFile")
                    .files[0];

            const button =
                document.getElementById(
                    "submitButton"
                );

            if (
                !name ||
                !groupName ||
                !description
            ) {

                showToast(
                    "Please complete all fields.",
                    "error"
                );

                return;
            }

            if (!file) {

                showToast(
                    "Please select a photo or video.",
                    "error"
                );

                return;
            }

            /*
               2 MB maximum.
            */

            const MAX_FILE_SIZE =
                2 * 1024 * 1024;

            if (
                file.size >
                MAX_FILE_SIZE
            ) {

                showToast(
                    "The selected file is larger than 2 MB.",
                    "error"
                );

                return;
            }

            button.disabled =
                true;

            button.textContent =
                "UPLOADING...";

            updateProgress(
                10,
                "Preparing upload..."
            );

            try {

                let mediaType =
                    "image";

                if (
                    file.type.startsWith(
                        "video/"
                    )
                ) {

                    mediaType =
                        "video";

                    const duration =
                        await getVideoDuration(
                            file
                        );

                    if (
                        duration >
                        MAX_VIDEO_SECONDS
                    ) {

                        throw new Error(
                            "Videos must be 5 minutes or shorter."
                        );
                    }
                }

                updateProgress(
                    25,
                    "Preparing file..."
                );

                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();

                const uniqueName =
                    `${Date.now()}-${crypto.randomUUID()}.${extension}`;

                console.log(
                    "Uploading:",
                    uniqueName
                );

                updateProgress(
                    40,
                    "Uploading photo/video..."
                );

                /*
                   Upload to booth-photos.
                */

                const uploadResult =
                    await supabaseClient
                        .storage
                        .from(BUCKET_NAME)
                        .upload(
                            uniqueName,
                            file,
                            {
                                cacheControl:
                                    "3600",

                                upsert:
                                    false,

                                contentType:
                                    file.type
                            }
                        );

                if (
                    uploadResult.error
                ) {

                    throw new Error(
                        "Storage upload failed: " +
                        uploadResult.error.message
                    );
                }

                updateProgress(
                    65,
                    "Creating contribution..."
                );

                /*
                   Get public URL.
                */

                const publicResult =
                    supabaseClient
                        .storage
                        .from(BUCKET_NAME)
                        .getPublicUrl(
                            uniqueName
                        );

                const mediaURL =
                    publicResult
                        .data
                        .publicUrl;

                /*
                   Save record.

                   IMPORTANT:
                   We only insert columns that
                   the booth table needs.
                */

                const insertResult =
                    await supabaseClient
                        .from(TABLE_NAME)
                        .insert({

                            name:
                                name,

                            group_name:
                                groupName,

                            description:
                                description,

                            media_url:
                                mediaURL,

                            media_type:
                                mediaType

                        })
                        .select()
                        .single();

                if (
                    insertResult.error
                ) {

                    /*
                       If database insertion fails,
                       remove the uploaded file.
                    */

                    await supabaseClient
                        .storage
                        .from(BUCKET_NAME)
                        .remove([
                            uniqueName
                        ]);

                    throw new Error(
                        "Database insert failed: " +
                        insertResult.error.message
                    );
                }

                updateProgress(
                    90,
                    "Refreshing contribution wall..."
                );

                await loadContributions();

                updateProgress(
                    100,
                    "Contribution added!"
                );

                showToast(
                    "🎉 Your contribution has been added!",
                    "success"
                );

                this.reset();

                document
                    .getElementById(
                        "videoStatus"
                    )
                    .textContent =
                        "";

                button.textContent =
                    "SUBMIT CONTRIBUTION";

                setTimeout(
                    function() {

                        document
                            .getElementById(
                                "gallery"
                            )
                            .scrollIntoView({
                                behavior:
                                    "smooth"
                            });

                    },
                    500
                );

            } catch(error) {

                console.error(
                    "Submission error:",
                    error
                );

                showToast(
                    error.message ||
                    "The contribution could not be submitted.",
                    "error"
                );

                button.textContent =
                    "SUBMIT CONTRIBUTION";

            } finally {

                button.disabled =
                    false;

                setTimeout(
                    function() {

                        document
                            .getElementById(
                                "progressContainer"
                            )
                            .style.display =
                                "none";

                    },
                    1000
                );
            }
        }
    );


/* =====================================================
   EDIT
===================================================== */

async function editContribution(id) {

    if (!verifyAdmin()) {
        return;
    }

    const item =
        contributions.find(
            contribution =>
                String(
                    contribution.id
                ) ===
                String(id)
        );

    if (!item) {

        showToast(
            "Contribution not found.",
            "error"
        );

        return;
    }

    const newName =
        prompt(
            "Contributor name:",
            item.name || ""
        );

    if (newName === null) {
        return;
    }

    const newGroup =
        prompt(
            "Section / Group:",
            item.group_name || ""
        );

    if (newGroup === null) {
        return;
    }

    const newDescription =
        prompt(
            "Contribution description:",
            item.description || ""
        );

    if (newDescription === null) {
        return;
    }

    try {

        const result =
            await supabaseClient
                .from(TABLE_NAME)
                .update({

                    name:
                        newName.trim(),

                    group_name:
                        newGroup.trim(),

                    description:
                        newDescription.trim()

                })
                .eq(
                    "id",
                    id
                );

        if (result.error) {
            throw result.error;
        }

        await loadContributions();

        showToast(
            "Contribution updated successfully!",
            "success"
        );

    } catch(error) {

        console.error(error);

        showToast(
            "Could not update contribution: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   DELETE
===================================================== */

async function deleteContribution(id) {

    if (!verifyAdmin()) {
        return;
    }

    const item =
        contributions.find(
            contribution =>
                String(
                    contribution.id
                ) ===
                String(id)
        );

    if (!item) {
        return;
    }

    const confirmed =
        confirm(
            `Delete ${item.name}'s contribution?\n\nThis cannot be undone.`
        );

    if (!confirmed) {
        return;
    }

    try {

        const deleteResult =
            await supabaseClient
                .from(TABLE_NAME)
                .delete()
                .eq(
                    "id",
                    id
                );

        if (
            deleteResult.error
        ) {

            throw deleteResult.error;
        }

        await loadContributions();

        showToast(
            "Contribution deleted.",
            "success"
        );

    } catch(error) {

        console.error(error);

        showToast(
            "Could not delete contribution: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   ADMIN PIN
===================================================== */

function verifyAdmin() {

    const entered =
        prompt(
            "Enter administrator PIN:"
        );

    if (
        entered !==
        ADMIN_PIN
    ) {

        showToast(
            "Incorrect administrator PIN.",
            "error"
        );

        return false;
    }

    return true;
}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function() {

            const query =
                this.value
                    .trim()
                    .toLowerCase();

            displayContributors(
                query
            );

            if (!query) {

                displayGallery(
                    contributions
                );

                return;
            }

            const filtered =
                contributions.filter(
                    item =>
                        (
                            item.name ||
                            ""
                        )
                        .toLowerCase()
                        .includes(
                            query
                        )
                );

            displayGallery(
                filtered
            );
        }
    );


/* =====================================================
   MEDIA MODAL
===================================================== */

function openMedia(url, type) {

    const modal =
        document.getElementById(
            "mediaModal"
        );

    const container =
        document.getElementById(
            "modalMedia"
        );

    if (type === "video") {

        container.innerHTML = `

            <video
                controls
                autoplay
                playsinline
            >

                <source
                    src="${escapeAttribute(url)}"
                >

                Your browser does not
                support video playback.

            </video>
        `;

    } else {

        container.innerHTML = `

            <img
                src="${escapeAttribute(url)}"
                alt="Booth contribution"
            >
        `;
    }

    modal.classList.add(
        "active"
    );
}


function closeMediaModal() {

    const modal =
        document.getElementById(
            "mediaModal"
        );

    const container =
        document.getElementById(
            "modalMedia"
        );

    container.innerHTML =
        "";

    modal.classList.remove(
        "active"
    );
}


document
    .getElementById("mediaModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeMediaModal();
            }
        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeMediaModal();
        }
    }
);

   PROGRESS
===================================================== */

    fill.style.width =

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer =
    null;


function showToast(
    message,
    type = "success"
) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.className =
        `toast ${type}`;

    setTimeout(
        function() {

            toast.classList.add(
                "show"
            );

        },
        10
    );

    if (toastTimer) {

        clearTimeout(
            toastTimer
        );
    }

    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            4500
        );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value) {

    return escapeHTML(
        value
    );
}

</script>
