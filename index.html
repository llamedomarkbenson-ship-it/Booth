    <script>

        /* ==========================================
           SUPABASE CONFIGURATION
        ========================================== */

        const SUPABASE_URL =
            "https://eqebdzbduixoyrqpsbui.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_tXcX-ng7EVHVaF1jaHXPlA_lh7Ip98L";


        /* ==========================================
           BOOTH CONFIGURATION
        ========================================== */

        const TABLE_NAME =
            "booth_contributions";

        const BUCKET_NAME =
            "booth-photos";

        const MAX_FILE_SIZE =
            2 * 1024 * 1024;

        const MAX_VIDEO_SECONDS =
            5 * 60;

        const ADMIN_PIN =
            "123456";


        let supabaseClient = null;
        let contributions = [];


        /* ==========================================
           SUPABASE INITIALIZATION
        ========================================== */

        if (!window.supabase) {

            showDatabaseError(
                new Error(
                    "Supabase library did not load."
                )
            );

        } else {

            try {

                supabaseClient =
                    window.supabase.createClient(
                        SUPABASE_URL,
                        SUPABASE_KEY
                    );

                console.log(
                    "Supabase initialized successfully."
                );

            } catch (error) {

                console.error(
                    "Supabase initialization error:",
                    error
                );

                showDatabaseError(error);

            }

        }


        /* ==========================================
           INITIAL LOAD
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                if (supabaseClient) {
                    loadContributions();
                }

            }
        );


        /* ==========================================
           LOAD CONTRIBUTIONS
        ========================================== */

        async function loadContributions() {

            showLoading();

            try {

                const response =
                    await supabaseClient
                        .from(TABLE_NAME)
                        .select("*");


                console.log(
                    "Supabase response:",
                    response
                );


                if (response.error) {
                    throw response.error;
                }


                contributions =
                    response.data || [];


                updateStatistics();

                displayContributors();

                displayGallery(
                    contributions
                );


            } catch (error) {

                console.error(
                    "Could not load contributions:",
                    error
                );

                showDatabaseError(error);

            }

        }


        /* ==========================================
           LOADING
        ========================================== */

        function showLoading() {

            const contributorList =
                document.getElementById(
                    "contributorList"
                );

            const galleryContainer =
                document.getElementById(
                    "galleryContainer"
                );


            if (contributorList) {

                contributorList.innerHTML = `

                    <div class="loading">

                        <div class="spinner"></div>

                        Loading contributors...

                    </div>
                `;

            }


            if (galleryContainer) {

                galleryContainer.innerHTML = `

                    <div class="loading">

                        <div class="spinner"></div>

                        Loading contributions...

                    </div>
                `;

            }

        }


        /* ==========================================
           DATABASE ERROR
        ========================================== */

        function showDatabaseError(error) {

            const message =
                error?.message ||
                "Unknown error.";


            const contributorList =
                document.getElementById(
                    "contributorList"
                );


            const galleryContainer =
                document.getElementById(
                    "galleryContainer"
                );


            if (contributorList) {

                contributorList.innerHTML = `

                    <div class="database-error">

                        <h3>
                            ⚠️ Could Not Load Contributors
                        </h3>

                        <p>
                            Check the booth_contributions
                            table and its policies.
                        </p>

                        <code>
                            ${escapeHTML(message)}
                        </code>

                    </div>
                `;

            }


            if (galleryContainer) {

                galleryContainer.innerHTML = `

                    <div class="database-error">

                        <h3>
                            ⚠️ Could Not Load Contributions
                        </h3>

                        <p>
                            Check the Booth Supabase
                            configuration.
                        </p>

                        <code>
                            ${escapeHTML(message)}
                        </code>

                    </div>
                `;

            }

        }


        /* ==========================================
           STATISTICS
        ========================================== */

        function updateStatistics() {

            const names =
                new Set();


            contributions.forEach(
                item => {

                    if (item.name) {

                        names.add(
                            item.name
                                .trim()
                                .toLowerCase()
                        );

                    }

                }
            );


            document.getElementById(
                "totalContributions"
            ).textContent =
                contributions.length;


            document.getElementById(
                "totalContributors"
            ).textContent =
                names.size;


            document.getElementById(
                "totalMedia"
            ).textContent =
                contributions.length;

        }


        /* ==========================================
           CONTRIBUTORS
        ========================================== */

        function displayContributors(
            search = ""
        ) {

            const container =
                document.getElementById(
                    "contributorList"
                );


            const grouped = {};


            contributions.forEach(
                item => {

                    const name =
                        (
                            item.name ||
                            "Unknown Contributor"
                        ).trim();


                    if (!grouped[name]) {
                        grouped[name] = 0;
                    }


                    grouped[name]++;

                }
            );


            const people =
                Object.entries(grouped)
                    .filter(
                        ([name]) =>
                            name
                                .toLowerCase()
                                .includes(
                                    search.toLowerCase()
                                )
                    )
                    .sort(
                        ([a], [b]) =>
                            a.localeCompare(b)
                    );


            if (people.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            👤
                        </div>

                        No contributors yet.

                    </div>
                `;

                return;

            }


            container.innerHTML = "";


            people.forEach(
                ([name, count]) => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "contributor";


                    element.innerHTML = `

                        <div class="contributor-name">

                            👤
                            ${escapeHTML(name)}

                        </div>

                        <div class="contributor-count">

                            ${count}
                            contribution${count === 1 ? "" : "s"}

                        </div>

                    `;


                    element.addEventListener(
                        "click",
                        function() {

                            document.getElementById(
                                "searchInput"
                            ).value =
                                name;


                            const filtered =
                                contributions.filter(
                                    item =>
                                        (
                                            item.name ||
                                            ""
                                        ).trim() ===
                                        name
                                );


                            displayGallery(
                                filtered
                            );


                            document.getElementById(
                                "gallery"
                            ).scrollIntoView({
                                behavior:
                                    "smooth"
                            });

                        }
                    );


                    container.appendChild(
                        element
                    );

                }
            );

        }


        /* ==========================================
           NORMALIZE DESCRIPTION
        ========================================== */

        function cleanDescription(value) {

            if (!value) {
                return "No description provided.";
            }


            return String(value)
                .split("\n")
                .map(
                    line =>
                        line
                            .replace(
                                /\s+/g,
                                " "
                            )
                            .trim()
                )
                .filter(
                    line =>
                        line.length > 0
                )
                .join("\n");

        }


        /* ==========================================
           GALLERY
        ========================================== */

        function displayGallery(items) {

            const container =
                document.getElementById(
                    "galleryContainer"
                );


            if (!items || items.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📸
                        </div>

                        <h3>
                            No contributions yet.
                        </h3>

                        <p>
                            Be the first to share
                            a contribution!
                        </p>

                    </div>
                `;

                return;

            }


            container.innerHTML = "";


            items.forEach(
                item => {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "card";


                    const mediaType =
                        item.media_type === "video"
                            ? "video"
                            : "image";


                    const mediaURL =
                        item.media_url || "";


                    let mediaHTML;


                    if (mediaType === "video") {

                        mediaHTML = `

                            <div
                                class="media"
                                data-media-url="${escapeAttribute(mediaURL)}"
                                data-media-type="video"
                            >

                                <span class="media-label">
                                    ▶ VIDEO
                                </span>

                                <video
                                    preload="metadata"
                                    muted
                                    playsinline
                                >

                                    <source
                                        src="${escapeAttribute(mediaURL)}"
                                    >

                                </video>

                            </div>

                        `;

                    } else {

                        mediaHTML = `

                            <div
                                class="media"
                                data-media-url="${escapeAttribute(mediaURL)}"
                                data-media-type="image"
                            >

                                <span class="media-label">
                                    📸 PHOTO
                                </span>

                                <img
                                    src="${escapeAttribute(mediaURL)}"
                                    alt="Booth contribution"
                                    loading="lazy"
                                >

                            </div>

                        `;

                    }


                    const cleanedDescription =
                        cleanDescription(
                            item.description
                        );


                    card.innerHTML = `

                        ${mediaHTML}

                        <div class="card-content">

                            <h3>
                                ${escapeHTML(
                                    item.name ||
                                    "Unknown Contributor"
                                )}
                            </h3>

                            <div class="card-description">

                                ${escapeHTML(
                                    cleanedDescription
                                )}

                            </div>

                            <div class="card-info">

                                👥

                                <strong>
                                    ${escapeHTML(
                                        item.group_name ||
                                        "No group"
                                    )}
                                </strong>

                            </div>

                            <div class="card-actions">

                                <button
                                    class="card-action edit-button"
                                    type="button"
                                >
                                    ✏ EDIT
                                </button>

                                <button
                                    class="card-action delete-button"
                                    type="button"
                                >
                                    🗑 DELETE
                                </button>

                            </div>

                        </div>

                    `;


                    const media =
                        card.querySelector(
                            ".media"
                        );


                    media.addEventListener(
                        "click",
                        function() {

                            openMedia(
                                media.dataset.mediaUrl,
                                media.dataset.mediaType
                            );

                        }
                    );


                    const editButton =
                        card.querySelector(
                            ".edit-button"
                        );


                    const deleteButton =
                        card.querySelector(
                            ".delete-button"
                        );


                    editButton.addEventListener(
                        "click",
                        function(event) {

                            event.stopPropagation();

                            editContribution(
                                item.id
                            );

                        }
                    );


                    deleteButton.addEventListener(
                        "click",
                        function(event) {

                            event.stopPropagation();

                            deleteContribution(
                                item.id
                            );

                        }
                    );


                    container.appendChild(
                        card
                    );

                }
            );

        }


        /* ==========================================
           FILE SELECTION
        ========================================== */

        document.getElementById(
            "mediaFile"
        ).addEventListener(
            "change",
            async function() {

                const file =
                    this.files[0];


                const status =
                    document.getElementById(
                        "videoStatus"
                    );


                const button =
                    document.getElementById(
                        "submitButton"
                    );


                if (!file) {

                    status.textContent =
                        "";

                    button.disabled =
                        false;

                    return;

                }


                if (
                    file.size >
                    MAX_FILE_SIZE
                ) {

                    status.textContent =
                        "❌ File is larger than 2 MB.";

                    button.disabled =
                        true;

                    return;

                }


                if (
                    file.type.startsWith(
                        "video/"
                    )
                ) {

                    status.textContent =
                        "Checking video duration...";

                    button.disabled =
                        true;


                    try {

                        const duration =
                            await getVideoDuration(
                                file
                            );


                        if (
                            duration >
                            MAX_VIDEO_SECONDS
                        ) {

                            status.textContent =
                                "❌ Video must be 5 minutes or shorter.";

                            button.disabled =
                                true;

                            return;

                        }


                        status.textContent =
                            "✅ Video accepted — maximum 5 minutes.";

                        button.disabled =
                            false;


                    } catch (error) {

                        status.textContent =
                            "❌ Could not read video duration.";

                        button.disabled =
                            true;

                    }

                } else {

                    status.textContent =
                        "✅ Photo selected.";

                    button.disabled =
                        false;

                }

            }
        );


        /* ==========================================
           VIDEO DURATION
        ========================================== */

        function getVideoDuration(file) {

            return new Promise(
                (resolve, reject) => {

                    const video =
                        document.createElement(
                            "video"
                        );


                    const objectURL =
                        URL.createObjectURL(
                            file
                        );


                    video.preload =
                        "metadata";


                    video.onloadedmetadata =
                        function() {

                            URL.revokeObjectURL(
                                objectURL
                            );


                            resolve(
                                video.duration
                            );

                        };


                    video.onerror =
                        function() {

                            URL.revokeObjectURL(
                                objectURL
                            );


                            reject(
                                new Error(
                                    "Could not read video."
                                )
                            );

                        };


                    video.src =
                        objectURL;

                }
            );

        }


        /* ==========================================
           SUBMIT CONTRIBUTION
        ========================================== */

        document.getElementById(
            "contributionForm"
        ).addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (!supabaseClient) {

                    showToast(
                        "Supabase is not connected.",
                        "error"
                    );

                    return;

                }


                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();


                const groupName =
                    document.getElementById(
                        "groupName"
                    ).value.trim();


                const description =
                    document.getElementById(
                        "description"
                    ).value.trim();


                const file =
                    document.getElementById(
                        "mediaFile"
                    ).files[0];


                const button =
                    document.getElementById(
                        "submitButton"
                    );


                if (
                    !name ||
                    !groupName ||
                    !description ||
                    !file
                ) {

                    showToast(
                        "Please complete all fields.",
                        "error"
                    );

                    return;

                }


                if (
                    file.size >
                    MAX_FILE_SIZE
                ) {

                    showToast(
                        "The selected file is larger than 2 MB.",
                        "error"
                    );

                    return;

                }


                button.disabled =
                    true;


                button.textContent =
                    "UPLOADING...";


                updateProgress(
                    10,
                    "Preparing upload..."
                );


                try {

                    let mediaType =
                        "image";


                    if (
                        file.type.startsWith(
                            "video/"
                        )
                    ) {

                        mediaType =
                            "video";


                        const duration =
                            await getVideoDuration(
                                file
                            );


                        if (
                            duration >
                            MAX_VIDEO_SECONDS
                        ) {

                            throw new Error(
                                "Videos must be 5 minutes or shorter."
                            );

                        }

                    }


                    updateProgress(
                        25,
                        "Preparing file..."
                    );


                    const extension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const uniqueName =
                        `${Date.now()}-${crypto.randomUUID()}.${extension}`;


                    updateProgress(
                        40,
                        "Uploading photo/video..."
                    );


                    const uploadResult =
                        await supabaseClient
                            .storage
                            .from(BUCKET_NAME)
                            .upload(
                                uniqueName,
                                file,
                                {
                                    cacheControl:
                                        "3600",

                                    upsert:
                                        false,

                                    contentType:
                                        file.type
                                }
                            );


                    if (
                        uploadResult.error
                    ) {

                        throw new Error(
                            "Storage upload failed: " +
                            uploadResult.error.message
                        );

                    }


                    updateProgress(
                        65,
                        "Creating contribution..."
                    );


                    const publicResult =
                        supabaseClient
                            .storage
                            .from(BUCKET_NAME)
                            .getPublicUrl(
                                uniqueName
                            );


                    const mediaURL =
                        publicResult
                            .data
                            .publicUrl;


                    const insertResult =
                        await supabaseClient
                            .from(TABLE_NAME)
                            .insert({

                                name:
                                    name,

                                group_name:
                                    groupName,

                                description:
                                    description,

                                media_url:
                                    mediaURL,

                                media_type:
                                    mediaType

                            });


                    if (
                        insertResult.error
                    ) {

                        await supabaseClient
                            .storage
                            .from(BUCKET_NAME)
                            .remove([
                                uniqueName
                            ]);


                        throw new Error(
                            "Database insert failed: " +
                            insertResult.error.message
                        );

                    }


                    updateProgress(
                        90,
                        "Refreshing gallery..."
                    );


                    await loadContributions();


                    updateProgress(
                        100,
                        "Contribution added!"
                    );


                    showToast(
                        "🎉 Contribution added successfully!",
                        "success"
                    );


                    document.getElementById(
                        "contributionForm"
                    ).reset();


                    document.getElementById(
                        "videoStatus"
                    ).textContent =
                        "";

                } catch (error) {

                    console.error(
                        "Submission error:",
                        error
                    );


                    showToast(
                        error.message ||
                        "Could not submit contribution.",
                        "error"
                    );

                } finally {

                    button.disabled =
                        false;


                    button.textContent =
                        "SUBMIT CONTRIBUTION";


                    setTimeout(
                        function() {

                            document.getElementById(
                                "progressContainer"
                            ).style.display =
                                "none";

                        },
                        1000
                    );

                }

            }
        );


        /* ==========================================
           EDIT
        ========================================== */

        async function editContribution(id) {

            if (!verifyAdmin()) {
                return;
            }


            const item =
                contributions.find(
                    contribution =>
                        String(
                            contribution.id
                        ) ===
                        String(id)
                );


            if (!item) {

                showToast(
                    "Contribution not found.",
                    "error"
                );

                return;

            }


            const newName =
                prompt(
                    "Contributor name:",
                    item.name || ""
                );


            if (newName === null) {
                return;
            }


            const newGroup =
                prompt(
                    "Section / Group:",
                    item.group_name || ""
                );


            if (newGroup === null) {
                return;
            }


            const newDescription =
                prompt(
                    "Contribution description:",
                    item.description || ""
                );


            if (newDescription === null) {
                return;
            }


            try {

                const result =
                    await supabaseClient
                        .from(TABLE_NAME)
                        .update({

                            name:
                                newName.trim(),

                            group_name:
                                newGroup.trim(),

                            description:
                                newDescription.trim()

                        })
                        .eq(
                            "id",
                            id
                        );


                if (result.error) {
                    throw result.error;
                }


                await loadContributions();


                showToast(
                    "Contribution updated successfully!",
                    "success"
                );


            } catch (error) {

                showToast(
                    "Could not update contribution: " +
                    error.message,
                    "error"
                );

            }

        }


        /* ==========================================
           DELETE
        ========================================== */

        async function deleteContribution(id) {

            if (!verifyAdmin()) {
                return;
            }


            const item =
                contributions.find(
                    contribution =>
                        String(
                            contribution.id
                        ) ===
                        String(id)
                );


            if (!item) {
                return;
            }


            const confirmed =
                confirm(
                    `Delete ${item.name}'s contribution?\n\nThis cannot be undone.`
                );


            if (!confirmed) {
                return;
            }


            try {

                const result =
                    await supabaseClient
                        .from(TABLE_NAME)
                        .delete()
                        .eq(
                            "id",
                            id
                        );


                if (result.error) {
                    throw result.error;
                }


                await loadContributions();


                showToast(
                    "Contribution deleted.",
                    "success"
                );


            } catch (error) {

                showToast(
                    "Could not delete contribution: " +
                    error.message,
                    "error"
                );

            }

        }


        /* ==========================================
           ADMIN PIN
        ========================================== */

        function verifyAdmin() {

            const entered =
                prompt(
                    "Enter administrator PIN:"
                );


            if (
                entered !==
                ADMIN_PIN
            ) {

                showToast(
                    "Incorrect administrator PIN.",
                    "error"
                );

                return false;

            }


            return true;

        }


        /* ==========================================
           SEARCH
        ========================================== */

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            function() {

                const query =
                    this.value
                        .trim()
                        .toLowerCase();


                displayContributors(
                    query
                );


                if (!query) {

                    displayGallery(
                        contributions
                    );

                    return;

                }


                const filtered =
                    contributions.filter(
                        item =>
                            (
                                item.name ||
                                ""
                            )
                            .toLowerCase()
                            .includes(
                                query
                            )
                    );


                displayGallery(
                    filtered
                );

            }
        );


        /* ==========================================
           MEDIA MODAL
        ========================================== */

        function openMedia(
            url,
            type
        ) {

            const modal =
                document.getElementById(
                    "mediaModal"
                );


            const container =
                document.getElementById(
                    "modalMedia"
                );


            if (type === "video") {

                container.innerHTML = `

                    <video
                        controls
                        autoplay
                        playsinline
                    >

                        <source
                            src="${escapeAttribute(url)}"
                        >

                    </video>

                `;

            } else {

                container.innerHTML = `

                    <img
                        src="${escapeAttribute(url)}"
                        alt="Booth contribution"
                    >

                `;

            }


            modal.classList.add(
                "active"
            );

        }


        function closeMediaModal() {

            const modal =
                document.getElementById(
                    "mediaModal"
                );


            const container =
                document.getElementById(
                    "modalMedia"
                );


            container.innerHTML =
                "";


            modal.classList.remove(
                "active"
            );

        }


        document.getElementById(
            "mediaModal"
        ).addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeMediaModal();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeMediaModal();

                }

            }
        );


        /* ==========================================
           PROGRESS
        ========================================== */

        function updateProgress(
            percentage,
            message
        ) {

            const container =
                document.getElementById(
                    "progressContainer"
                );


            const fill =
                document.getElementById(
                    "progressFill"
                );


            const text =
                document.getElementById(
                    "progressText"
                );


            container.style.display =
                "block";


            fill.style.width =
                percentage + "%";


            text.textContent =
                message;

        }


        /* ==========================================
           TOAST
        ========================================== */

        let toastTimer =
            null;


        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.className =
                `toast ${type}`;


            setTimeout(
                function() {

                    toast.classList.add(
                        "show"
                    );

                },
                10
            );


            if (toastTimer) {

                clearTimeout(
                    toastTimer
                );

            }


            toastTimer =
                setTimeout(
                    function() {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    4500
                );

        }


        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        function escapeAttribute(value) {

            return escapeHTML(
                value
            );

        }

    </script>

</body>
